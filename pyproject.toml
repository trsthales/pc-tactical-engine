# Configuração das ferramentas de qualidade. As dependências continuam em requirements.txt.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "C4", "PERF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dxcam", "cv2", "pyttsx3", "comtypes", "scipy.*", "shapely", "shapely.*", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
